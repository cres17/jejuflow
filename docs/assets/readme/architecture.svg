<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">JEJUFLOW</title><desc id="desc">날씨로 장소 후보를 고르고, 일정과 캐시를 기기에 보관합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#326FA2" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="604" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="152" rx="24" fill="#182432" stroke="none"/><rect x="0" y="116" width="1120" height="36" rx="0" fill="#182432" stroke="none"/><text x="40" y="38" font-size="13" fill="#A8BCCB" font-weight="650">SYSTEM OVERVIEW</text><text x="40" y="85" font-size="34" fill="#FFFFFF" font-weight="650">JEJUFLOW</text><text x="40" y="122" font-size="17" fill="#CFD9E2" font-weight="400">날씨로 장소 후보를 고르고, 일정과 캐시를 기기에 보관합니다.</text><text x="40" y="184" font-size="16" fill="#326FA2" font-weight="650">추천 화면</text><rect x="40" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="236" font-size="22" fill="#202B38" font-weight="650">위치 · 권역</text><text x="60" y="266" font-size="16" fill="#657180" font-weight="400">제주시 / 서귀포시</text><path d="M373 262 L390 262" fill="none" stroke="#326FA2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="236" font-size="22" fill="#202B38" font-weight="650">날씨 + 장소 서비스</text><text x="416" y="266" font-size="16" fill="#657180" font-weight="400">기상청 · TourAPI</text><path d="M729 262 L746 262" fill="none" stroke="#326FA2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="236" font-size="22" fill="#202B38" font-weight="650">Now 카드</text><text x="772" y="266" font-size="16" fill="#657180" font-weight="400">실내 / 야외 후보 필터</text><text x="40" y="364" font-size="16" fill="#326FA2" font-weight="650">일정 만들기</text><rect x="40" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="416" font-size="22" fill="#202B38" font-weight="650">장소 선택</text><text x="60" y="446" font-size="16" fill="#657180" font-weight="400">시간 지정 · 경로 구성</text><path d="M373 442 L390 442" fill="none" stroke="#326FA2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="416" font-size="22" fill="#202B38" font-weight="650">Hive 저장</text><text x="416" y="446" font-size="16" fill="#657180" font-weight="400">일정 · API 응답 캐시</text><path d="M729 442 L746 442" fill="none" stroke="#326FA2" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="416" font-size="22" fill="#202B38" font-weight="650">로컬 알림</text><text x="772" y="446" font-size="16" fill="#657180" font-weight="400">일정 30분 전 알림</text><text x="40" y="581" font-size="13" fill="#657180" font-weight="400">조회 실패 시 만료 캐시 또는 내장값으로 대체합니다. Web에서는 별도 프록시를 사용합니다.</text></svg>