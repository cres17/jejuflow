name: App CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: New API keys take priority and URL encoding is normalized
        run: >-
          flutter test test/api_keys_test.dart
          --dart-define=KEY_TEST_MODE=new
          --dart-define=JEJUFLOW_WEATHER_API_KEY=key%2Bvalue%3D
          --dart-define=JEJUFLOW_TAGO_API_KEY=new-tago
          --dart-define=JEJUFLOW_TOUR_API_KEY=new-tour
          --dart-define=JEJUFLOW_KAKAOMAP_KEY=new-kakao
          --dart-define=WEATHER_API_KEY=ignored
          --dart-define=EXPO_PUBLIC_WEATHER_API_KEY=ignored
      - name: Existing API key names remain compatible
        run: >-
          flutter test test/api_keys_test.dart
          --dart-define=KEY_TEST_MODE=legacy
          --dart-define=WEATHER_API_KEY=old-weather
          --dart-define=EXPO_PUBLIC_TAGO_API_KEY=old-tago
          --dart-define=TOUR_API_KEY=old-tour
          --dart-define=EXPO_KAKAOMAP_KEY=old-kakao
      - run: flutter build web --release
      - run: flutter build apk --debug
      - name: Compile release bundle without signing secrets
        run: flutter build appbundle --release
        env:
          JEJUFLOW_UNSIGNED_BUILD: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: jejuflow-ci-${{ github.sha }}
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
