name: Signed Android release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Android versionCode (greater than the last published build)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Validate release inputs and prepare signing
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEATHER_KEY: ${{ secrets.JEJUFLOW_WEATHER_API_KEY }}
          TAGO_KEY: ${{ secrets.JEJUFLOW_TAGO_API_KEY }}
          TOUR_KEY: ${{ secrets.JEJUFLOW_TOUR_API_KEY }}
          KAKAO_KEY: ${{ secrets.JEJUFLOW_KAKAOMAP_KEY }}
        run: python3 scripts/prepare_release.py
      - name: Build signed APK and AAB
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          flutter build apk --release --build-number="$BUILD_NUMBER" --dart-define-from-file="$RUNNER_TEMP/jejuflow-defines.json"
          flutter build appbundle --release --build-number="$BUILD_NUMBER" --dart-define-from-file="$RUNNER_TEMP/jejuflow-defines.json"
      - uses: actions/upload-artifact@v4
        with:
          name: jejuflow-signed-${{ inputs.build_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/jejuflow-release.jks" "$RUNNER_TEMP/jejuflow-defines.json"
